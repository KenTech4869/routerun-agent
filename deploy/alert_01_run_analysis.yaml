# alert_01_run_analysis.yaml
#
# Cloud Monitoring: run-analysis DLQ アラート
#
# デプロイ:
#   gcloud alpha monitoring policies create \
#     --policy-from-file=deploy/alert_01_run_analysis.yaml \
#     --project=runroute-476505
#
# 前提: run-analysis-dlq-sub サブスクリプションが存在すること
# 通知チャネル取得: gcloud alpha monitoring channels list --project=runroute-476505

displayName: "RouteRun PubSub DLQ Alert — run-analysis"
documentation:
  content: |
    ## run-analysis DLQ にメッセージが蓄積しています

    **原因の可能性:**
    - onRunAnalysisTrigger のタイムアウト (540s 超過)
    - 未処理の例外 (claimedAt トランザクション以外のパス)
    - Firestore の一時的な書き込み失敗

    **確認手順:**
    1. Cloud Logging: `resource.type="cloud_function" AND resource.labels.function_name="onRunAnalysisTrigger"`
    2. Firestore: `run_analysis_queue` コレクションで `status="processing"` かつ古い `claimedAt` を確認
    3. PubSub コンソール: run-analysis-dlq-sub のメッセージを確認

    **解消手順:**
    - DLQ メッセージを手動で再パブリッシュ: `gcloud pubsub subscriptions pull run-analysis-dlq-sub --limit=10`
    - スタックした processing ジョブをリセット: Firestore で `claimedAt` を削除して再トリガー
  mimeType: text/markdown
combiner: OR
conditions:
  - displayName: "DLQ message count > 0 (5分間)"
    conditionThreshold:
      filter: |
        resource.type = "pubsub_subscription"
        AND resource.label.subscription_id = "run-analysis-dlq-sub"
        AND metric.type = "pubsub.googleapis.com/subscription/num_undelivered_messages"
      comparison: COMPARISON_GT
      thresholdValue: 0
      duration: 300s
      aggregations:
        - alignmentPeriod: 60s
          crossSeriesReducer: REDUCE_MAX
          perSeriesAligner: ALIGN_MAX
      trigger:
        count: 1
  - displayName: "onRunAnalysisTrigger エラー率 > 5% (10分間)"
    conditionThreshold:
      filter: |
        resource.type = "cloud_function"
        AND resource.label.function_name = "onRunAnalysisTrigger"
        AND metric.type = "cloudfunctions.googleapis.com/function/execution_count"
        AND metric.label.status = "error"
      comparison: COMPARISON_GT
      thresholdValue: 0.05
      duration: 600s
      aggregations:
        - alignmentPeriod: 60s
          crossSeriesReducer: REDUCE_MEAN
          perSeriesAligner: ALIGN_RATE
      trigger:
        count: 1
alertStrategy:
  autoClose: 1800s
notificationChannels:
  - projects/runroute-476505/notificationChannels/REPLACE_WITH_CHANNEL_ID
severity: CRITICAL
userLabels:
  service: "routerun-coaching"
  component: "run-analysis-pipeline"
  env: "production"
