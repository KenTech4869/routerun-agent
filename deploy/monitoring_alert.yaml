# monitoring_alert.yaml
#
# このファイルは目次です。実際のアラートポリシーは個別ファイルに分割されています。
# (gcloud alpha monitoring policies create は単一ドキュメントのみ対応のため)
#
# デプロイ方法:
#   # 通知チャネル ID を確認
#   gcloud alpha monitoring channels list --project=runroute-476505
#
#   # REPLACE_WITH_CHANNEL_ID を置換してデプロイ
#   CHANNEL_ID="projects/runroute-476505/notificationChannels/YOUR_ID"
#   for f in deploy/alert_0*.yaml; do
#     sed -i '' "s|REPLACE_WITH_CHANNEL_ID|YOUR_ID|g" "$f"
#     gcloud alpha monitoring policies create --policy-from-file="$f" --project=runroute-476505
#   done
#
#   または setup_infrastructure.sh を実行 (Pub/Sub DLQ + Firestore TTL も含む):
#   ./deploy/setup_infrastructure.sh
#
# アラートポリシー一覧:
#   alert_01_run_analysis.yaml   — run-analysis DLQ (CRITICAL)
#   alert_02_proactive_coach.yaml — proactive-coach DLQ (CRITICAL)
#   alert_03_gemini_429.yaml     — Gemini 429 カスケード (WARNING)
